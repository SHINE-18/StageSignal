<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18120E"/>
      <stop offset="100%" stop-color="#0C0D0E"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA726"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#DC143C"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#2B201B" stroke-width="6"/>

  <!-- Subtle grid accent -->
  <line x1="256" y1="64" x2="256" y2="448" stroke="#261C17" stroke-width="2" stroke-dasharray="8 8"/>
  <line x1="64" y1="256" x2="448" y2="256" stroke="#261C17" stroke-width="2" stroke-dasharray="8 8"/>

  <!-- Signal Waves radiating from Stage to FOH (Grace Flame Palette) -->
  <!-- Outer wave -->
  <path d="M120 220 C140 140 372 140 392 220" fill="none" stroke="#DC143C" stroke-width="18" stroke-linecap="round" opacity="0.4"/>
  <!-- Middle wave -->
  <path d="M156 250 C180 180 332 180 356 250" fill="none" stroke="#F97316" stroke-width="20" stroke-linecap="round" opacity="0.8" filter="url(#glow)"/>
  <!-- Inner wave -->
  <path d="M196 280 C216 230 296 230 316 280" fill="none" stroke="#FFA726" stroke-width="22" stroke-linecap="round"/>

  <!-- Center Stage/FOH Transmitter Beacon -->
  <circle cx="256" cy="336" r="44" fill="url(#flameGrad)" filter="url(#glow)"/>
  <circle cx="256" cy="336" r="22" fill="#FFFBF5"/>
  <circle cx="256" cy="336" r="8" fill="#DC143C"/>

  <!-- Antenna mast base -->
  <path d="M246 380 L236 424 L276 424 L266 380 Z" fill="#DC143C" opacity="0.85"/>
  <line x1="220" y1="424" x2="292" y2="424" stroke="#FFA726" stroke-width="6" stroke-linecap="round"/>
</svg>